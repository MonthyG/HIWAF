# GraphQL profile, written for HI WAF (not an OWASP CRS release).
#
# A GraphQL request sends its query as text in the JSON field "query". GraphQL
# syntax looks like SQL and shell to these rules ({ id }, user(...), $first), so
# they skip that one field on /graphql. The query's "variables", where user
# input goes, are still checked by every rule. Rules found with real queries
# (wafbench, 2026-11-09):
#   932235 932236  Unix command injection    ({ node, { id)
#   942150 942190 942410  SQL function names (user()
#   942290         MongoDB injection         ($first, $in)
#   942430         restricted SQL characters (many {}()$ in one value)
SecRule TX:graphql-rule-exclusions_enabled "@eq 0" "id:9590099,phase:1,pass,nolog,ctl:ruleRemoveById=9590100-9590999"
SecRule REQUEST_FILENAME "@rx /graphql/?$" \
    "id:9590100,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.query,\
    ctl:ruleRemoveTargetById=932236;ARGS:json.query,\
    ctl:ruleRemoveTargetById=942150;ARGS:json.query,\
    ctl:ruleRemoveTargetById=942190;ARGS:json.query,\
    ctl:ruleRemoveTargetById=942290;ARGS:json.query,\
    ctl:ruleRemoveTargetById=942410;ARGS:json.query,\
    ctl:ruleRemoveTargetById=942430;ARGS:json.query"
