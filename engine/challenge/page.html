<h1>Checking your browser&hellip;</h1>
<p id="s">This only takes a moment.</p>

<script>
(function(){
var T={{.Token}},D={{.Difficulty}},RET={{.Return}},Z="";
for(var i=0;i<D;i++)Z+="0";
function R(x,n){return x>>>n|x<<(32-n)}
var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
// Pure-JS SHA-256 (ASCII input) for pages where crypto.subtle is unavailable (plain HTTP).
function sha256(s){
var b=[],i,j,l=s.length;
for(i=0;i<l;i++)b.push(s.charCodeAt(i)&255);
b.push(128);while(b.length%64!==56)b.push(0);
var hi=Math.floor(l*8/4294967296),lo=(l*8)>>>0;
b.push(hi>>>24&255,hi>>>16&255,hi>>>8&255,hi&255,lo>>>24,lo>>>16&255,lo>>>8&255,lo&255);
var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19],w=[];
for(i=0;i<b.length;i+=64){
for(j=0;j<16;j++)w[j]=(b[i+4*j]<<24|b[i+4*j+1]<<16|b[i+4*j+2]<<8|b[i+4*j+3])|0;
for(;j<64;j++){var a=w[j-15],c=w[j-2];
w[j]=(w[j-16]+(R(a,7)^R(a,18)^a>>>3)+w[j-7]+(R(c,17)^R(c,19)^c>>>10))|0}
var v=H.slice();
for(j=0;j<64;j++){
var e=v[4],t1=(v[7]+(R(e,6)^R(e,11)^R(e,25))+((e&v[5])^(~e&v[6]))+K[j]+w[j])|0,
t2=((R(v[0],2)^R(v[0],13)^R(v[0],22))+((v[0]&v[1])^(v[0]&v[2])^(v[1]&v[2])))|0;
v=[(t1+t2)|0,v[0],v[1],v[2],(v[3]+t1)|0,v[4],v[5],v[6]]}
for(j=0;j<8;j++)H[j]=(H[j]+v[j])|0}
return H.map(function(x){return("0000000"+(x>>>0).toString(16)).slice(-8)}).join("")}
function hex(buf){var u=new Uint8Array(buf),o="";for(var i=0;i<u.length;i++)o+=("0"+u[i].toString(16)).slice(-2);return o}
var sub=window.crypto&&window.crypto.subtle,enc=window.TextEncoder?new TextEncoder():null;
function done(n){location.replace("/.hi-waf/verify?c="+encodeURIComponent(T)+"&n="+n+"&r="+encodeURIComponent(RET))}
function fail(){document.getElementById("s").textContent="Verification failed. Please reload the page."}
function solveSync(n){
(function step(){
for(var k=0;k<2000;k++,n++){if(sha256(T+":"+n).indexOf(Z)===0)return done(n)}
setTimeout(step,0)})()}
function solveSubtle(n){
sub.digest("SHA-256",enc.encode(T+":"+n)).then(function(d){
if(hex(d).indexOf(Z)===0)done(n);else solveSubtle(n+1)},fail)}
try{if(sub&&enc)solveSubtle(0);else solveSync(0)}catch(e){fail()}
})();
</script></body></html>
