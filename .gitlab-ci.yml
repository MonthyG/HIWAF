workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never # the merge request pipeline already covers this push
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "build"'
    - if: "$CI_COMMIT_TAG"
    - when: never

default:
  image: docker:29.8.2-cli
  tags:
    - docker
  before_script:
    - echo "$HARBOR_PASSWORD" | docker login $HARBOR_HOST -u $HARBOR_USERNAME --password-stdin

stages:
  - test
  - build
  - release

variables:
  CONTAINER_PROJECT: $HARBOR_HOST/$HARBOR_PROJECT
  CONTAINER_IMAGE: $CONTAINER_PROJECT/$CI_PROJECT_NAME

# gofmt, vet, then every test, including integration/ (in-process Caddy on ports 9080
# and 2999). -race needs cgo; the golang image ships gcc. The console's type check runs
# inside the image build.
test:
  stage: test
  image: golang:1.27.3-trixie
  interruptible: true
  before_script: []
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod/
  script:
    - out=$(gofmt -l cmd engine manager integration)
    - if [ -n "$out" ]; then echo "Not gofmt-formatted:"; echo "$out"; exit 1; fi
    - go vet ./...
    - go test -race -count=1 ./...

build:
  stage: build
  interruptible: true
  rules: # images are pushed only from the build branch and tags
    - if: '$CI_COMMIT_BRANCH == "build"'
    - if: "$CI_COMMIT_TAG"
  services:
    - name: docker:29.8.2-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  script:
    - docker context create ci-dind
    - docker buildx create --name ci-builder --driver docker-container --use ci-dind

    - |
      docker buildx bake --file - --push <<'EOF'
      variable "CONTAINER_IMAGE" {}
      variable "CI_COMMIT_SHORT_SHA" {}

      group "default" {
        targets = ["images"]
      }

      target "images" {
        matrix = {
          service = [
            { target = "engine", image = "${CONTAINER_IMAGE}-engine" },
            { target = "manager", image = "${CONTAINER_IMAGE}-manager" }
          ]
        }
        name = service.target
        context = "."
        dockerfile = "Dockerfile"
        target = service.target
        tags = ["${service.image}:${CI_COMMIT_SHORT_SHA}"]
        cache-from = ["type=registry,ref=${service.image}:buildcache"]
        cache-to = ["type=registry,ref=${service.image}:buildcache,mode=max,compression=zstd,compression-level=3"]
      }
      EOF

release:
  stage: release
  variables:
    GIT_STRATEGY: none
    TARGETS: engine manager
  script:
    - |
      for TARGET in $TARGETS; do
        CONTAINER_TARGET_IMAGE="$CONTAINER_IMAGE-$TARGET"
        docker buildx imagetools create \
          --tag "$CONTAINER_TARGET_IMAGE:$CI_COMMIT_TAG" \
          --tag "$CONTAINER_TARGET_IMAGE:latest" \
          "$CONTAINER_TARGET_IMAGE:$CI_COMMIT_SHORT_SHA"
      done
  rules:
    - if: "$CI_COMMIT_TAG"
